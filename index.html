<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story of Kapuas — Kapuas: Menyusuri Narasi di Sungai Terpanjang Indonesia</title>
  <meta name="description" content="Story of Kapuas — menyusuri narasi sejarah, budaya, dan kehidupan di Sungai Kapuas, sungai terpanjang di Indonesia." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="page">
    <div class="ring-decoration" aria-hidden="true">
      <img class="ring-decoration__img" src="assets/icons/ring-decoration.svg" alt="" />
    </div>

    <section class="hero" id="hero" aria-labelledby="hero-title">
      <div class="hero-bg">
        <img
          class="hero-bg__img"
          src="assets/images/hero-kapuas.svg"
          alt="Pemandangan Sungai Kapuas saat matahari terbit"
        />
        <div class="hero-bg__overlay" aria-hidden="true"></div>
      </div>

      <div class="hero-content">
        <h1 id="hero-title" class="hero-title animate-fade-up" style="--animation-delay: 0.15s">
          Kapuas: Menyusuri Narasi<br />
          di Sungai Terpanjang<br />
          Indonesia
        </h1>
      </div>

      <button
        type="button"
        id="explore-btn"
        class="explore-btn animate-fade-up"
        style="--animation-delay: 0.9s"
        aria-label="Mulai telusuri Sungai Kapuas"
      >
        <span class="explore-btn__label">Mulai Telusuri</span>
        <svg class="explore-btn__icon" viewBox="0 0 12 8" fill="none" aria-hidden="true">
          <path d="M0.75 0.75L6 6.25L11.25 0.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </section>

    <header class="site-header animate-fade-in">
      <a href="#hero" class="logo" aria-label="Kapuas, kembali ke halaman utama">KAPUAS</a>
      <nav class="nav" aria-label="Navigasi utama">
        <button
          type="button"
          id="nature-sounds-btn"
          class="nav-sounds"
          aria-pressed="false"
          aria-label="Nyalakan suara alam"
        >
          <svg class="nav-sounds__icon" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M1.5 6.5V11.5H4.5L9 15V3L4.5 6.5H1.5Z" fill="currentColor" />
            <path d="M11.5 5.5C12.4 6.3 12.9 7.4 12.9 9C12.9 10.6 12.4 11.7 11.5 12.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
            <path d="M14 3.2C15.8 4.7 16.8 6.8 16.8 9C16.8 11.2 15.8 13.3 14 14.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
          </svg>
          <span class="nav-sounds__label">NATURE SOUNDS</span>
        </button>
        <button type="button" id="menu-btn" class="nav-menu" aria-label="Buka menu navigasi">
          <svg viewBox="0 0 18 12" fill="none" aria-hidden="true">
            <path d="M0 1H18M0 6H18M0 11H18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
      </nav>
    </header>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
